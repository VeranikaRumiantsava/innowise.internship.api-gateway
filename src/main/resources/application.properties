spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://userservice:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/user/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=AddUserIdHeader

spring.cloud.gateway.server.webflux.routes[1].id=cardinfo-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://userservice:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/cardinfo/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AddUserIdHeader

spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://orderservice:8080
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/orders/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AddUserIdHeader

spring.cloud.gateway.server.webflux.routes[3].id=auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://authservice:8080
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/auth/**

